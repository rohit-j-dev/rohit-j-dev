name: Update profile

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: update-profile
  cancel-in-progress: false

jobs:
  metrics:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check metrics availability
        id: metrics-token
        env:
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: |
          if [ -n "$METRICS_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Metrics skipped: configure the METRICS_TOKEN repository secret." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Generate detailed metrics
        if: steps.metrics-token.outputs.enabled == 'true'
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ github.token }}
          committer_branch: main
          committer_message: |
            chore: update detailed metrics [skip ci]

            Co-authored-by: Copilot App <223556219+Copilot@users.noreply.github.com>
          use_prebuilt_image: "no"
          clean_workflows: "no"
          plugins_errors_fatal: "yes"
          user: rohit-j-dev
          filename: assets/metrics.svg
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Kolkata
          plugin_lines: "yes"
          plugin_lines_history_limit: 1
          plugin_languages: "yes"
          plugin_languages_sections: most-used
          plugin_languages_details: bytes-size, percentage
          plugin_habits: "yes"
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_isocalendar: "yes"
          plugin_isocalendar_duration: full-year
      - name: Reveal metrics only after the image exists
        if: steps.metrics-token.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import subprocess
          import xml.etree.ElementTree as ET

          repo = os.environ["GITHUB_REPOSITORY"]
          def api(path, body=None):
              args = ["gh", "api", f"repos/{repo}/contents/{path}"]
              if body is not None:
                  args += ["--method", "PUT", "--input", "-"]
              result = subprocess.run(args, input=json.dumps(body) if body else None, text=True, capture_output=True)
              if result.returncode:
                  raise RuntimeError(result.stderr)
              return json.loads(result.stdout)

          image = api("assets/metrics.svg?ref=main")
          svg = ET.fromstring(base64.b64decode(image["content"]))
          if svg.tag != "{http://www.w3.org/2000/svg}svg":
              raise ValueError("Generated metrics are not an SVG")
          file = api("README.md?ref=main")
          current = base64.b64decode(file["content"]).decode()
          start, end = "<!--START_SECTION:metrics-->", "<!--END_SECTION:metrics-->"
          if current.count(start) != 1 or current.count(end) != 1:
              raise ValueError("Metrics markers are missing or ambiguous")
          before, rest = current.split(start)
          _, after = rest.split(end)
          updated = before + start + '\n<div align="center"><img src="assets/metrics.svg" alt="Detailed metrics"/></div>\n' + end + after
          if updated != current:
              api("README.md", {
                  "branch": "main", "sha": file["sha"],
                  "message": "chore: show generated metrics [skip ci]\n\nCo-authored-by: Copilot App <223556219+Copilot@users.noreply.github.com>",
                  "content": base64.b64encode(updated.encode()).decode(),
              })
          PY

  snake:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Generate contribution snake
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
      - name: Check generated images
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for name in ("github-snake.svg", "github-snake-dark.svg"):
              root = ET.parse(Path("dist") / name).getroot()
              if root.tag != "{http://www.w3.org/2000/svg}svg":
                  raise ValueError(f"Invalid snake SVG: {name}")
          PY
      - name: Publish snake without rewriting history
        uses: crazy-max/ghaction-github-pages@5859b4ea7efe6b470a5b19c570460eae9323aefc # v3
        with:
          target_branch: output
          build_dir: dist
          keep_history: true
          allow_empty_commit: false
          commit_message: |
            chore: update contribution snake [skip ci]

            Co-authored-by: Copilot App <223556219+Copilot@users.noreply.github.com>
        env:
          GITHUB_TOKEN: ${{ github.token }}

  activity:
    needs: metrics
    if: always() && github.ref == 'refs/heads/main' && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out latest main after metrics
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          # The activity action runs git push and needs checkout's scoped credential.
          persist-credentials: true
      - name: Prepare activity section
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("README.md")
          current = path.read_text()
          start, end = "<!--START_SECTION:activity-->", "<!--END_SECTION:activity-->"
          if current.count(start) != 1 or current.count(end) != 1:
              raise ValueError("Activity markers are missing or ambiguous")
          before, rest = current.split(start)
          _, after = rest.split(end)
          path.write_text(before + start + "\n" + end + after)
          PY
      - name: Update recent public activity
        uses: jamesgeorge007/github-activity-readme@4aefbfa1c222d70537dc6a02f0519266aab2b1ea # master
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          MAX_LINES: 8
          COMMIT_MSG: |
            chore: update recent activity [skip ci]

            Co-authored-by: Copilot App <223556219+Copilot@users.noreply.github.com>
          EMPTY_COMMIT_MSG: |
            chore: keep profile updates active [skip ci]

            Co-authored-by: Copilot App <223556219+Copilot@users.noreply.github.com>
      - name: Record an honest empty activity state
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("README.md")
          current = path.read_text()
          empty = "<!--START_SECTION:activity-->\n<!--END_SECTION:activity-->"
          if empty in current:
              path.write_text(current.replace(empty, "<!--START_SECTION:activity-->\nNo recent public issue, pull-request, comment, or release activity to display yet.\n<!--END_SECTION:activity-->"))
          PY
          if ! git diff --quiet -- README.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "chore: update recent activity [skip ci]" -m "Co-authored-by: Copilot App <223556219+Copilot@users.noreply.github.com>"
            git push origin HEAD:main
          fi
