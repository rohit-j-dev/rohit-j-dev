name: Profilescape

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: profilescape-publish
  cancel-in-progress: false

jobs:
  cards:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Render and publish public profile cards
        uses: chethandvg/profilescape@f10e76d00155d5fc56ff8de4a42a68ba6f3a66f3
        with:
          username: rohit-j-dev
          cards: stats,3d,languages
          theme: aurora
          modes: dark,light
          include_private: "false"
          publish: branch
          branch: profilescape-output
          commit_message: |
            chore: refresh public profile cards [skip ci]

            Co-authored-by: Copilot App <223556219+Copilot@users.noreply.github.com>
          config: |
            {
              "options": {
                "stats": {
                  "metrics": ["currentStreak", "longestStreak", "commits", "allTime", "bestWeek", "years"],
                  "chart": "weekly"
                },
                "3d": {
                  "insights": true,
                  "peak": true
                },
                "languages": {
                  "layout": "bar",
                  "weighting": "commits"
                }
              }
            }
      - name: Generate public contribution snake
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b
        with:
          github_user_name: rohit-j-dev
          outputs: |
            assets/contribution-snake-dark.svg?palette=github-dark&color_snake=#3EC6E0&color_dots=#1A1F2C,#4D4976,#8B7CFF,#5DA8EC,#82DAEB
            assets/contribution-snake-light.svg?palette=github-light&color_snake=#0E9DB8&color_dots=#EDEFF5,#C4BEFF,#8B7CFF,#5DA8EC,#0E9DB8
      - name: Publish snake images without rewriting history
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen

          root = f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/contents"
          headers = {
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "Content-Type": "application/json",
          }
          for name in ("contribution-snake-dark.svg", "contribution-snake-light.svg"):
              path = f"assets/{name}"
              content = Path(path).read_bytes()
              try:
                  with urlopen(Request(f"{root}/{path}?ref=main", headers=headers), timeout=30) as response:
                      current = json.load(response)
              except HTTPError as error:
                  if error.code != 404:
                      raise
                  current = None
              if current and base64.b64decode(current["content"]) == content:
                  print(f"{path} is unchanged")
                  continue
              body = {
                  "message": "chore: refresh contribution snake [skip ci]\n\nCo-authored-by: Copilot App <223556219+Copilot@users.noreply.github.com>",
                  "branch": "main",
                  "content": base64.b64encode(content).decode("ascii"),
              }
              if current:
                  body["sha"] = current["sha"]
              request = Request(f"{root}/{path}", data=json.dumps(body).encode(), headers=headers, method="PUT")
              with urlopen(request, timeout=30) as response:
                  result = json.load(response)
              print(f"Published {path}: {result['commit']['sha']}")
          PY
