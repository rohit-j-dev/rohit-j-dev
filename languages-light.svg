<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="200" viewBox="0 0 1200 200" role="img" aria-labelledby="ps-title"><title id="ps-title">Most used languages (by commits)</title><desc>No language data yet</desc><defs><clipPath id="ps-clip"><rect width="1200" height="200" rx="20"/></clipPath><radialGradient id="ps-glow" cx="0" cy="0" r="0.9"><stop offset="0" stop-color="#5B4BFF" stop-opacity="0.05"/><stop offset="1" stop-color="#5B4BFF" stop-opacity="0"/></radialGradient><clipPath id="lg-bar"><rect x="40" y="80" width="1120" height="16" rx="8"/></clipPath><style>.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Inter',Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,'JetBrains Mono','Cascadia Code',Consolas,Menlo,monospace}.fade{animation:ps-fade .6s ease-out backwards}@keyframes ps-fade{from{opacity:0}}.up{animation:ps-up .7s cubic-bezier(.2,.7,.2,1) backwards}@keyframes ps-up{from{opacity:0;transform:translateY(10px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}.lg-seg{transform-box:fill-box;transform-origin:0 50%;animation:lg-grow .8s cubic-bezier(.2,.7,.2,1) backwards}@keyframes lg-grow{from{transform:scaleX(0)}}</style></defs><g clip-path="url(#ps-clip)"><rect width="1200" height="200" fill="#FFFFFF"/><rect width="1200" height="200" fill="url(#ps-glow)"/></g><text x="40" y="56" class="mono" font-size="12" letter-spacing="1.4" fill="#0C8298">LANGUAGES · WEIGHTED BY COMMITS</text><rect x="40" y="80" width="1120" height="16" rx="8" fill="#EDEFF5"/><g clip-path="url(#lg-bar)"></g><g class="fade" style="animation-delay:0.2s"><text x="40" y="138" class="sans" font-size="16" font-weight="600" fill="#0F172A">No language data yet</text><text x="40" y="160" class="sans" font-size="13" fill="#525B70">Your languages will appear here once your repositories have code.</text></g><rect x=".5" y=".5" width="1199" height="199" rx="20" fill="none" stroke="#E3E6EF"/></svg>
