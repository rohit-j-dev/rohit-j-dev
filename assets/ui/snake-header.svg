<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="187" viewBox="0 0 1200 187" role="img" aria-labelledby="title">
<title id="title">04 // Contribution trail — public contributions, eaten by a snake.</title>
<style>
.sans{font-family:'Segoe UI', 'Inter', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif}
.mono{font-family:ui-monospace, 'SFMono-Regular', 'Cascadia Code', Consolas, 'Liberation Mono', monospace}
.twinkle{animation:twinkle 4s ease-in-out infinite}
.aurora{animation:aurora 16s ease-in-out infinite alternate}
.aurora.b{animation-duration:21s;animation-direction:alternate-reverse}
.bob{transform-box:fill-box;transform-origin:50% 90%;animation:bob 6s ease-in-out infinite}
.shimmer{animation:shimmer 3.2s ease-in-out infinite}
.glow{animation:glow 7s ease-in-out infinite}
.cursor{animation:blink 1.1s steps(1) infinite}
.petal{animation:fall linear infinite}
.sweep{animation:sweep 9s ease-in-out infinite}
.wave{animation:wave 14s linear infinite}
.wave.b{animation-duration:22s;animation-direction:reverse}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.2}50%{opacity:1}}
@keyframes aurora{from{transform:translate(-40px,0)}to{transform:translate(60px,18px)}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-1.2deg)}50%{transform:translateY(5px) rotate(1.2deg)}}
@keyframes shimmer{0%,100%{opacity:.25}50%{opacity:.85}}
@keyframes glow{0%,100%{opacity:.55}50%{opacity:.9}}
@keyframes blink{0%{opacity:1}50%{opacity:0}}
@keyframes fall{from{transform:translate(0,-40px) rotate(0deg)}to{transform:translate(-260px,620px) rotate(540deg)}}
@keyframes sweep{0%{transform:translateX(-30%)}100%{transform:translateX(130%)}}
@keyframes wave{from{transform:translateX(0)}to{transform:translateX(-600px)}}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.8)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<defs>
<linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#FFFFFF"/><stop offset=".55" stop-color="#D8CCFF"/><stop offset="1" stop-color="#22D3EE"/>
</linearGradient>
<linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#22D3EE"/><stop offset=".5" stop-color="#8B5CF6"/><stop offset="1" stop-color="#F472B6"/>
</linearGradient>
<linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#0D1230"/><stop offset="1" stop-color="#090C1E"/>
</linearGradient>
<linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#22D3EE" stop-opacity=".55"/><stop offset=".45" stop-color="#8B5CF6" stop-opacity=".25"/>
  <stop offset="1" stop-color="#F472B6" stop-opacity=".45"/>
</linearGradient>
<linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#141A3D"/><stop offset="1" stop-color="#0E1230"/>
</linearGradient>
<linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/><stop offset=".5" stop-color="#FFFFFF" stop-opacity=".07"/>
  <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
</linearGradient>
<radialGradient id="glowCyan"><stop offset="0" stop-color="#22D3EE" stop-opacity=".5"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></radialGradient>
<radialGradient id="glowViolet"><stop offset="0" stop-color="#8B5CF6" stop-opacity=".55"/><stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/></radialGradient>
<radialGradient id="glowPink"><stop offset="0" stop-color="#F472B6" stop-opacity=".4"/><stop offset="1" stop-color="#F472B6" stop-opacity="0"/></radialGradient>
</defs>
<clipPath id="clip"><rect width="1200" height="187" rx="28"/></clipPath>
<g clip-path="url(#clip)">
<rect width="1200" height="187" fill="url(#card)"/>
<ellipse cx="1080" cy="0" rx="420" ry="84" fill="url(#glowViolet)" opacity=".55"/>
<ellipse cx="0" cy="187" rx="360" ry="65" fill="url(#glowCyan)" opacity=".35"/>
</g>
<rect x=".75" y=".75" width="1198.5" height="185.5" rx="27.5" fill="none" stroke="url(#edge)" stroke-width="1.5"/>
<rect x="56" y="0" width="120" height="3" rx="1.5" fill="url(#accent)"/>
<text x="56.0" y="72.0" class="mono" font-size="16" font-weight="600" fill="#22D3EE" text-anchor="start" letter-spacing="4">04 // CONTRIBUTION TRAIL</text>
<text x="56.0" y="122.0" class="sans" font-size="34" font-weight="700" fill="#EEF1FF" text-anchor="start">Every commit feeds the snake</text><text x="56.0" y="159.0" class="sans" font-size="19" font-weight="500" fill="#A3ACCF" text-anchor="start">Public contributions · refreshed daily</text>
</svg>
