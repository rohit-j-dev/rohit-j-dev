<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="Profile banner" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#090418"/>
      <stop offset="0.4" stop-color="#2d0f5a"/>
      <stop offset="0.75" stop-color="#b53a7c"/>
      <stop offset="1" stop-color="#ff9a5a"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff2a8"/>
      <stop offset="0.55" stop-color="#ff9a5a"/>
      <stop offset="1" stop-color="#ff3d81"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffc2e0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <clipPath id="sunclip"><circle cx="880" cy="235" r="105"/></clipPath>
  </defs>

  <rect width="1200" height="400" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#fff">
    <circle cx="120" cy="40" r="1.5"><animate attributeName="opacity" values="1;.2;1" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="70" r="1.2"><animate attributeName="opacity" values=".3;1;.3" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="520" cy="30" r="1.8"><animate attributeName="opacity" values="1;.3;1" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="640" cy="90" r="1.2"><animate attributeName="opacity" values=".2;1;.2" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="1040" cy="50" r="1.6"><animate attributeName="opacity" values="1;.2;1" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="1130" cy="110" r="1.2"><animate attributeName="opacity" values=".4;1;.4" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="40" r="1.3"><animate attributeName="opacity" values="1;.3;1" dur="4s" repeatCount="indefinite"/></circle>
  </g>

  <!-- sun with glow and stripes -->
  <circle cx="880" cy="235" r="130" fill="#ff5fa2" opacity=".55" filter="url(#glow)"/>
  <g clip-path="url(#sunclip)">
    <rect x="770" y="125" width="220" height="220" fill="url(#sun)"/>
    <g fill="#b53a7c">
      <rect x="770" y="250" width="220" height="4"/>
      <rect x="770" y="270" width="220" height="7"/>
      <rect x="770" y="292" width="220" height="10"/>
      <rect x="770" y="316" width="220" height="14"/>
    </g>
  </g>

  <!-- far mountains -->
  <path d="M0 300 L120 235 L230 285 L360 215 L500 290 L640 240 L780 300 L930 225 L1080 290 L1200 250 L1200 400 L0 400Z" fill="#3a1470" opacity=".85"/>
  <!-- near mountains -->
  <path d="M0 340 L150 285 L290 330 L430 275 L600 335 L760 290 L920 340 L1060 295 L1200 335 L1200 400 L0 400Z" fill="#1e0a40"/>

  <!-- torii gate -->
  <g fill="#0e0524" transform="translate(1010 205)">
    <rect x="0" y="22" width="12" height="120"/>
    <rect x="98" y="22" width="12" height="120"/>
    <path d="M-22 14 Q55 28 132 14 L136 0 Q55 14 -26 0Z"/>
    <rect x="8" y="42" width="94" height="8"/>
    <rect x="50" y="22" width="10" height="20"/>
  </g>

  <!-- skyline -->
  <g fill="#0e0524">
    <rect x="0" y="330" width="60" height="70"/>
    <rect x="60" y="305" width="45" height="95"/>
    <rect x="105" y="340" width="55" height="60"/>
    <rect x="160" y="315" width="40" height="85"/>
    <rect x="200" y="345" width="70" height="55"/>
    <rect x="270" y="320" width="50" height="80"/>
    <rect x="320" y="350" width="80" height="50"/>
    <rect x="400" y="330" width="45" height="70"/>
    <rect x="445" y="352" width="90" height="48"/>
    <rect x="535" y="338" width="50" height="62"/>
    <rect x="585" y="356" width="120" height="44"/>
    <rect x="705" y="342" width="55" height="58"/>
    <rect x="760" y="358" width="140" height="42"/>
    <rect x="900" y="346" width="60" height="54"/>
    <rect x="960" y="360" width="240" height="40"/>
  </g>
  <g fill="#ffd36e">
    <rect x="70" y="315" width="4" height="5"><animate attributeName="opacity" values="1;.2;1" dur="5s" repeatCount="indefinite"/></rect>
    <rect x="85" y="330" width="4" height="5"/>
    <rect x="168" y="325" width="4" height="5"><animate attributeName="opacity" values=".3;1;.3" dur="4s" repeatCount="indefinite"/></rect>
    <rect x="280" y="332" width="4" height="5"/>
    <rect x="300" y="345" width="4" height="5"><animate attributeName="opacity" values="1;.2;1" dur="6s" repeatCount="indefinite"/></rect>
    <rect x="410" y="342" width="4" height="5"/>
    <rect x="545" y="350" width="4" height="5"><animate attributeName="opacity" values=".2;1;.2" dur="3.5s" repeatCount="indefinite"/></rect>
    <rect x="715" y="352" width="4" height="5"/>
    <rect x="910" y="358" width="4" height="5"><animate attributeName="opacity" values="1;.3;1" dur="4.5s" repeatCount="indefinite"/></rect>
  </g>

  <!-- falling blossoms -->
  <g fill="#ffb7d5" opacity=".85">
    <ellipse rx="5" ry="3"><animateMotion dur="9s" repeatCount="indefinite" path="M620 -10 Q560 200 480 420"/></ellipse>
    <ellipse rx="4" ry="2.5"><animateMotion dur="12s" begin="-4s" repeatCount="indefinite" path="M760 -10 Q700 180 650 420"/></ellipse>
    <ellipse rx="5" ry="3"><animateMotion dur="10s" begin="-2s" repeatCount="indefinite" path="M980 -10 Q900 220 820 420"/></ellipse>
    <ellipse rx="4" ry="2.5"><animateMotion dur="14s" begin="-7s" repeatCount="indefinite" path="M1100 -10 Q1040 200 960 420"/></ellipse>
    <ellipse rx="5" ry="3"><animateMotion dur="11s" begin="-5s" repeatCount="indefinite" path="M420 -10 Q380 180 300 420"/></ellipse>
    <ellipse rx="3.5" ry="2"><animateMotion dur="13s" begin="-9s" repeatCount="indefinite" path="M880 -10 Q820 200 740 420"/></ellipse>
  </g>

  <!-- text -->
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="70" y="165" font-size="20" fill="#ffc2e0" letter-spacing="6" opacity=".9">HELLO, I'M</text>
    <text x="68" y="235" font-size="64" font-weight="800" fill="url(#title)">ROHIT JAGADALE</text>
    <text x="70" y="275" font-size="22" fill="#ffe3f1">Builder  ·  Problem Solver  ·  Ships Code Daily</text>
    <rect x="70" y="292" width="140" height="4" rx="2" fill="#ff5fa2"/>
  </g>
</svg>
